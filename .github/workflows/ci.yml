name: CI

on:
  push:
    branches: [main]
    # Pull requests always run everything, so the required "CI" check is never left waiting.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
  workflow_dispatch:
  # The release workflow runs the full suite against the tagged commit before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bridge:
    name: Bridge bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The bundle only changes with the bridge source, the build script or the pinned Paseo version.
      - name: Restore bridge bundle
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bridge/dist
            bridge/package.json
          key: bridge-${{ hashFiles('bridge/bridge.ts', 'scripts/build-bridge.sh', 'Makefile') }}

      - name: Build bridge (fetches Paseo source)
        if: steps.cache.outputs.cache-hit != 'true'
        run: make bridge

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge
          path: |
            bridge/dist
            bridge/package.json
          retention-days: 3

  lint:
    name: Lint
    needs: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge
          path: bridge

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: make fmt-check

      - name: go.mod is tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: shellcheck
        run: shellcheck scripts/*.sh packaging/*.sh

      # Render the package manifests against a throwaway build, so a broken template fails here, not at release.
      - name: Package manifests render
        run: |
          mkdir -p dist
          for f in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do echo "$(printf '%064d' 0)  paseo-tui_$f.tar.gz"; done > dist/checksums.txt
          for f in windows_amd64 windows_arm64; do echo "$(printf '%064d' 0)  paseo-tui_$f.zip"; done >> dist/checksums.txt
          packaging/render.sh v0.0.0
          ruby -c dist/pkg/homebrew/paseo-tui.rb
          jq -e .version dist/pkg/scoop/paseo-tui.json

  test:
    name: Test (${{ matrix.os }})
    needs: bridge
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge
          path: bridge

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: go test (race detector)
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: go test
        if: runner.os == 'Windows'
        run: go test ./...

  cross-build:
    name: Compile every release platform
    needs: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge
          path: bridge

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Compile only: binaries are built and published by the release workflow alone.
      - name: Cross-compile
        run: make cross

  # The single check to require in branch protection.
  ci:
    name: CI
    if: always()
    needs: [bridge, lint, test, cross-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
