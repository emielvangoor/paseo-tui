name: Release

# Push a tag like v0.2.0 (or v0.2.0-rc.1 for a pre-release) to test, build and publish a release.
# A failed run can be retried with "Re-run all jobs": a leftover draft is replaced, but a
# published release is never modified.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No write token here: this job runs Paseo's npm install and the Go toolchain.
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not a semantic version tag (vX.Y.Z or vX.Y.Z-pre)"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v ver="${TAG#v}" '
            index($0, "## [" ver "]") == 1 || index($0, "## " ver) == 1 {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1
          fi
          cat >> notes.md <<EOF

          ## Install

          \`\`\`sh
          brew install emielvangoor/tap/paseo-tui                      # macOS, Linux
          scoop bucket add emielvangoor https://github.com/emielvangoor/scoop-bucket
          scoop install emielvangoor/paseo-tui                         # Windows
          \`\`\`

          Or download a file below:

          | Platform | Download |
          |---|---|
          | macOS (Apple Silicon / Intel) | \`paseo-tui_darwin_arm64.tar.gz\` / \`paseo-tui_darwin_amd64.tar.gz\` |
          | Linux x86_64 / ARM64 | \`paseo-tui_linux_amd64.tar.gz\` / \`paseo-tui_linux_arm64.tar.gz\` |
          | Debian, Ubuntu | \`paseo-tui_${TAG#v}_amd64.deb\` / \`paseo-tui_${TAG#v}_arm64.deb\` |
          | Fedora, RHEL, openSUSE | \`paseo-tui-${TAG#v}-1.x86_64.rpm\` / \`paseo-tui-${TAG#v}-1.aarch64.rpm\` |
          | Alpine | \`paseo-tui_${TAG#v}_x86_64.apk\` / \`paseo-tui_${TAG#v}_aarch64.apk\` |
          | Windows x86_64 / ARM64 | \`paseo-tui_windows_amd64.zip\` / \`paseo-tui_windows_arm64.zip\` |

          Installed from an archive? \`paseo-tui update\` installs new releases (0.2.0 and later).

          To verify a download by hand:

          \`\`\`sh
          sha256sum --check --ignore-missing checksums.txt
          gh attestation verify paseo-tui_linux_amd64.tar.gz --repo ${GITHUB_REPOSITORY}
          \`\`\`
          EOF

      # Built from scratch, never from a cache, so nothing a pull request wrote can reach a release.
      - name: Build the bridge
        run: make bridge

      - name: Test against the release bridge
        run: go test ./...

      - name: Build archives and Linux packages for every platform
        run: make release VERSION="$TAG"

      # Homebrew, Scoop and AUR manifests with this release's checksums (stable releases only).
      - name: Render package-manager manifests
        if: ${{ !contains(github.ref_name, '-') }}
        run: packaging/render.sh "$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
            dist/pkg
            notes.md
            keys/release.pub.pem
          if-no-files-found: error
          include-hidden-files: true # dist/pkg/aur/.SRCINFO
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # paseo-tui update installs a release only if checksums.txt carries this signature.
      - name: Sign checksums.txt
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The release environment has no RELEASE_SIGNING_KEY secret"; exit 1
          fi
          key="$RUNNER_TEMP/release-signing-key.pem"
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/checksums.txt | base64 -w0 > dist/checksums.txt.sig
          shred -u "$key"
          # The signature must verify against the public key the binaries embed.
          base64 -d dist/checksums.txt.sig > "$RUNNER_TEMP/sig.bin"
          openssl pkeyutl -verify -rawin -pubin -inkey keys/release.pub.pem \
            -in dist/checksums.txt -sigfile "$RUNNER_TEMP/sig.bin"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk

      - name: Publish the GitHub release
        run: |
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != true ]; then
              echo "::error::$TAG is already published; releases are never modified. Tag a new version."; exit 1
            fi
            echo "Replacing the draft left by an earlier attempt"
            gh release delete "$TAG" --yes
          fi
          # Tags with a suffix (v0.2.0-rc.1) are pre-releases and never become "latest".
          case "$TAG" in
            *-*) kind=--prerelease; latest=--latest=false ;;
            *) kind=--prerelease=false; latest=--latest ;;
          esac
          # Upload everything to a draft first, so a release is never visible half-uploaded.
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.apk \
            dist/checksums.txt dist/checksums.txt.sig \
            --draft --verify-tag "$kind" --title "paseo-tui $TAG" --notes-file notes.md
          gh release edit "$TAG" --draft=false "$latest"

  # ---------- package managers (stable releases only) ----------
  # Each channel is its own job, so one failing doesn't hold back the others. After fixing the cause,
  # use "Re-run failed jobs": the GitHub release itself is already published and is never touched again.
  distribute:
    name: Publish to ${{ matrix.channel }}
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: homebrew
            secret: HOMEBREW_TAP_DEPLOY_KEY
          - channel: scoop
            secret: SCOOP_BUCKET_DEPLOY_KEY
          - channel: aur
            secret: AUR_SSH_KEY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # The AUR channel is off until a maintainer is set up (issue #8): set the repository variable
      # AUR_PUBLISH=true and the AUR_SSH_KEY secret to turn it on.
      - name: AUR publishing is off
        if: ${{ matrix.channel == 'aur' && vars.AUR_PUBLISH != 'true' }}
        run: echo "::notice::Skipping the AUR; set the AUR_PUBLISH repository variable to true to publish there"

      - name: Push the ${{ matrix.channel }} manifest
        if: ${{ matrix.channel != 'aur' || vars.AUR_PUBLISH == 'true' }}
        env:
          DEPLOY_KEY: ${{ secrets[matrix.secret] }}
        run: packaging/publish.sh "${{ matrix.channel }}" "${{ github.ref_name }}"

  # Install from each channel the way a user would, with no secrets.
  verify-homebrew:
    name: Verify Homebrew install
    needs: [publish, distribute]
    # Runs even if another channel failed; checks only its own.
    if: ${{ always() && needs.publish.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    timeout-minutes: 15
    permissions: {}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - run: |
          brew install emielvangoor/tap/paseo-tui
          paseo-tui --version | tee /dev/stderr | grep -qx "paseo-tui $TAG"
          brew test paseo-tui

  verify-scoop:
    name: Verify Scoop install
    needs: [publish, distribute]
    # Runs even if another channel failed; checks only its own.
    if: ${{ always() && needs.publish.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions: {}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add emielvangoor https://github.com/emielvangoor/scoop-bucket
          scoop install emielvangoor/paseo-tui
          $v = paseo-tui --version
          Write-Output $v
          if ($v -ne "paseo-tui $env:TAG") { throw "expected paseo-tui $env:TAG, got $v" }

  verify-aur:
    name: Verify AUR install
    needs: [publish, distribute]
    # Runs even if another channel failed; checks only its own.
    if: ${{ always() && needs.publish.result == 'success' && !contains(github.ref_name, '-') && vars.AUR_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    permissions: {}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - run: |
          pacman -Syu --noconfirm --needed git >/dev/null
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          su builder -c 'cd ~ && git clone -q https://aur.archlinux.org/paseo-tui-bin.git && cd paseo-tui-bin && makepkg -si --noconfirm'
          paseo-tui --version | tee /dev/stderr | grep -qx "paseo-tui $TAG"
