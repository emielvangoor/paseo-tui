name: Release

# Push a tag like v0.1.0 to build every platform and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          make bridge
          go vet ./...
          go test ./...

      - name: Build archives for every platform
        run: make release VERSION="$TAG"

      - name: Release notes
        run: |
          # The section for this version from CHANGELOG.md, falling back to a short note.
          awk -v ver="${TAG#v}" '
            $0 ~ "^## \\[?" ver "\\]?" {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $TAG" > notes.md; fi
          cat >> notes.md <<'EOF'

          ## Install

          | Platform | Download |
          |---|---|
          | macOS (Apple Silicon) | `paseo-tui_darwin_arm64.tar.gz` |
          | macOS (Intel) | `paseo-tui_darwin_amd64.tar.gz` |
          | Linux x86_64 | `paseo-tui_linux_amd64.tar.gz` |
          | Linux ARM64 | `paseo-tui_linux_arm64.tar.gz` |
          | Windows x86_64 | `paseo-tui_windows_amd64.zip` |
          | Windows ARM64 | `paseo-tui_windows_arm64.zip` |

          Each archive holds a single self-contained binary. Verify downloads with `checksums.txt`.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt \
              --title "paseo-tui $TAG" --notes-file notes.md
          fi
