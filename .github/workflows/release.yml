name: Release

# Push a tag like v0.2.0 (or v0.2.0-rc.1 for a pre-release) to test, build and publish a release.
# A failed run can be retried with "Re-run all jobs": a leftover draft is replaced, but a
# published release is never modified.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No write token here: this job runs Paseo's npm install and the Go toolchain.
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not a semantic version tag (vX.Y.Z or vX.Y.Z-pre)"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v ver="${TAG#v}" '
            index($0, "## [" ver "]") == 1 || index($0, "## " ver) == 1 {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1
          fi
          cat >> notes.md <<EOF

          ## Install

          | Platform | Download |
          |---|---|
          | macOS (Apple Silicon) | \`paseo-tui_darwin_arm64.tar.gz\` |
          | macOS (Intel) | \`paseo-tui_darwin_amd64.tar.gz\` |
          | Linux x86_64 | \`paseo-tui_linux_amd64.tar.gz\` |
          | Linux ARM64 | \`paseo-tui_linux_arm64.tar.gz\` |
          | Windows x86_64 | \`paseo-tui_windows_amd64.zip\` |
          | Windows ARM64 | \`paseo-tui_windows_arm64.zip\` |

          Each archive holds a single self-contained binary. To verify a download:

          \`\`\`sh
          sha256sum --check --ignore-missing checksums.txt
          gh attestation verify paseo-tui_linux_amd64.tar.gz --repo ${GITHUB_REPOSITORY}
          \`\`\`
          EOF

      # Built from scratch, never from a cache, so nothing a pull request wrote can reach a release.
      - name: Build the bridge
        run: make bridge

      - name: Test against the release bridge
        run: go test ./...

      - name: Build archives for every platform
        run: make release VERSION="$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Publish the GitHub release
        run: |
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != true ]; then
              echo "::error::$TAG is already published; releases are never modified. Tag a new version."; exit 1
            fi
            echo "Replacing the draft left by an earlier attempt"
            gh release delete "$TAG" --yes
          fi
          # Tags with a suffix (v0.2.0-rc.1) are pre-releases and never become "latest".
          case "$TAG" in
            *-*) kind=--prerelease; latest=--latest=false ;;
            *) kind=--prerelease=false; latest=--latest ;;
          esac
          # Upload everything to a draft first, so a release is never visible half-uploaded.
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --draft --verify-tag "$kind" --title "paseo-tui $TAG" --notes-file notes.md
          gh release edit "$TAG" --draft=false "$latest"
